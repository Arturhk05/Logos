x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://logos:logos@db:5432/logos

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos
      POSTGRES_DB: logos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    image: logos-api
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: logos-api
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
