name: CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations scripts
      # Integration and API tests start PostgreSQL with testcontainers, using the runner's Docker.
      - run: uv run pytest
