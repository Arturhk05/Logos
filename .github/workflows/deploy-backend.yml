name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - infra/ec2-deploy.sh
      - .github/workflows/deploy-backend.yml
      # Documentation alone does not change what runs.
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/logos-github-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations scripts
      - run: uv run pytest

  build:
    needs: test
    # The API host is ARM (t4g), so the image is built natively on an ARM runner.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          # The image URI contains the account id; if masked, GitHub drops the job output the deploy job needs.
          mask-aws-account-id: false
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        run: echo "image=${{ steps.ecr.outputs.registry }}/logos-api:${{ github.sha }}" >>"$GITHUB_OUTPUT"
      - run: |
          docker build --tag "${{ steps.image.outputs.image }}" backend
          docker push "${{ steps.image.outputs.image }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Bounds the polling loop below if SSM never reports a final status.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run infra/ec2-deploy.sh on the API host through SSM
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          script=$(base64 --wrap=0 infra/ec2-deploy.sh)
          parameters=$(jq -n --arg cmd "echo $script | base64 -d >/tmp/logos-deploy.sh && bash /tmp/logos-deploy.sh $IMAGE" \
            '{commands: [$cmd], executionTimeout: ["900"]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "logos deploy ${GITHUB_SHA::7}" --parameters "$parameters" --query Command.CommandId --output text)

          # The built-in SSM waiter gives up after 100 s; the first deploy can take longer.
          while true; do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending | InProgress | Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "SSM status: $status"
          test "$status" = Success
