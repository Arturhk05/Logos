# Same behavior as CloudFront in production: one origin for the interface and the API (ADR-01),
# and React routes answered with index.html without touching API responses (ADR-09).
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # A missing build file is an error, never index.html served as a script.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
